[tools]
"conda:clang" = "latest"
"github:xmake-io/xmake" = "latest"
clang-format = "latest"
"conda:cppcheck" = "latest"
"conda:bear" = "latest"

[tasks.build]
description = "compile main (non debug)"
run = "xmake f -m release -y && xmake -y"

[tasks.dev]
description = "compile main (debug/dev build)"
run = "xmake f -m debug -y && xmake -y"

[tasks.test]
description = "compile and run allocator tests"
run = "xmake test -vD"

[tasks.stress]
description = "run the allocator stress-test stub"
run = "xmake test allocator-stress/* -vD"

[tasks.run]
description = "run release build"
depends = ["build"]
run = "xmake run app"

[tasks.dev-run]
description = "run debug/dev build"
depends = ["dev"]
run = "xmake run app"

[tasks.compiledb]
description = "generate compile_commands.json for neovim"
run = "xmake project -k compile_commands ."

[tasks.check]
description = "check stuff"
run = "cppcheck --enable=all --suppress=missingIncludeSystem main.c src/*.c"

[tasks.format]
description = "format C sources and headers"
run = "find src include tests examples -type f \\( -name '*.c' -o -name '*.h' \\) -print0 | xargs -0 clang-format -i && clang-format -i main.c tests_c.h"

[tasks.clean]
description = "remove build artifacts"
run = "xmake clean -a && rm -rf build compile_commands.json"
