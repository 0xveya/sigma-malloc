[tools]
zig = "0.16.0"
clang-format = "latest"
"conda:cppcheck" = "latest"
"conda:bear" = "latest"

[tasks.build]
description = "compile main (non debug)"
run = "zig build -Doptimize=ReleaseFast"

[tasks.dev]
description = "compile main (debug/dev build)"
run = "zig build -Doptimize=Debug"

[tasks.test]
description = "compile and run tests (if test.c exists)"
run = "zig build && [ -f zig-out/bin/tests ] && ./zig-out/bin/tests || echo 'No tests binary compiled (test.c not found)'"

[tasks.run]
description = "run release build"
depends = ["build"]
run = "./zig-out/bin/app"

[tasks.dev-run]
description = "run debug/dev build"
depends = ["dev"]
run = "./zig-out/bin/app-dev"

[tasks.std]
description = "run zig std documentation server"
run = "zig std -p 8000 --no-open-browser"

[tasks.compiledb]
description = "generate compile_commands.json for neovim"
run = "make compiledb"

[tasks.check]
description = "check stuff"
run = "cppcheck --enable=all --suppress=missingIncludeSystem main.c src/*.c"

[tasks.format]
description = "format files"
run = "clang-format -i main.c src/*.c include/*.h"

[tasks.clean]
description = "remove build artifacts"
run = "rm -rf zig-out .zig-cache compile_commands.json .bear-fingerprints app app-dev tests"
